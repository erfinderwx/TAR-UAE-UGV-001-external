name: 检查文件头

on:
  pull_request:
    paths: ["docs/**", "tools/**", "README.md", "使用说明.md"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/build_index.py --check

      - run: python3 tools/check_docs.py
